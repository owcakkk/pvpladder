name: Refresh Minecraft usernames

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Call the username refresh endpoint
        env:
          SYNC_SECRET: ${{ secrets.SITE_SYNC_SECRET }}
        run: |
          curl --fail --show-error --silent --max-time 30 -X POST \
            "https://pvpladder.lovable.app/api/public/jobs/refresh-minecraft-usernames" \
            -H "Authorization: Bearer ${SYNC_SECRET}" \
            -H "Content-Type: application/json" \
            -d '{"kind":"minecraft-usernames"}'
